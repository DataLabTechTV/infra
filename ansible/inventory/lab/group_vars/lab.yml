# --- ansible ---

ansible_user: rocky
ansible_python_interpreter: /usr/bin/python3
ansible_ssh_common_args: -i "{{ vm_ssh_key_path }}" -o StrictHostKeyChecking=no


# --- global ----

context: "{{ group_names[0] }}"

project_dir: "{{ playbook_dir }}/../.."
quadlets_dir: "{{ project_dir }}/quadlets"
tests_dir: "{{ project_dir }}/tests"
local_dir: "{{ project_dir }}/local"

ca_host: "core.lan"
ca_addr: "https://{{ ca_host }}"

openbao_addr: "http://data.lan:8200"

postgres_host: "data.lan"
postgres_port: 5432

rustfs_access_key: "rustfs"

forgejo_host: "git.lab.lan"
forgejo_addr: "https://{{ forgejo_host }}"
forgejo_ssh_addr: "ssh://git@{{ forgejo_host }}:222"
forgejo_admin_user: "forgejo"
forgejo_admin_email: "forgejo@forge.lan"

artifact_keeper_addr: "https://artifacts.lab.lan"


# --- configure ---

pki_bootstrap: true

pki_output_dir: "{{ local_dir }}/{{ context }}/pki"
pki_root_key_file: "{{ pki_output_dir }}/root-ca.key"
pki_root_csr_file: "{{ pki_output_dir }}/root-ca.csr"
pki_root_cert_file: "{{ pki_output_dir }}/root-ca.crt"


# --- deploy ---

deployment_order:
  - step-ca
  - openbao
  - postgres
  - rustfs
  - forgejo
  - forgejo-runner
  - artifact-keeper
  - traefik
  - coredns
  - llama-server
  - embedding-server
  - bifrost
  - open-webui
  - pi-sandbox

routes:
  core.lan:
    admin.core: 9090
  data.lan:
    admin.data: 9090
    vault: 8200
    store: 9000
    admin.store: 9001
  forge.lan:
    admin.forge: 9090
    git: 3000
  gpu.lan:
    admin.gpu: 9090
    llm: 8080
    chat: 3000
    gateway: 4040
  dev.lan:
    admin.dev: 9090
  proxy.lan:
    admin.proxy: 9090
    artifacts: 3000

tcp_routes:
  forgejo_ssh:
    source: 222
    targets:
      - host: forge.lan
        port: 222
  pi_sandbox_ssh:
    source: 2222
    targets:
      - host: dev.lan
        port: 2222

step_ca_output_dir: "{{ local_dir }}/{{ context }}/step-ca"
step_ca_intermediate_key_file: "{{ step_ca_output_dir }}/intermediate-ca.key"
step_ca_intermediate_csr_file: "{{ step_ca_output_dir }}/intermediate-ca.csr"
step_ca_intermediate_cert_file: "{{ step_ca_output_dir }}/intermediate-ca.crt"
step_ca_admin_public_key_file: "{{ step_ca_output_dir }}/admin.pub.json"
step_ca_admin_private_key_file: "{{ step_ca_output_dir }}/admin.json"
step_ca_squid_public_key_file: "{{ step_ca_output_dir }}/squid.pub.json"
step_ca_squid_private_key_file: "{{ step_ca_output_dir }}/squid.json"

squid_output_dir: "{{ local_dir }}/{{ context }}/squid"
squid_key_file: "{{ squid_output_dir }}/squid-ca.key"
squid_csr_file: "{{ squid_output_dir }}/squid-ca.csr"
squid_cert_file: "{{ squid_output_dir }}/squid-ca.crt"

openbao_config_file: "{{ quadlets_dir }}/openbao/config/openbao.json"
openbao_output_dir: "{{ local_dir }}/{{ context }}/openbao"
openbao_iac_token_file: "{{ openbao_output_dir }}/iac.token"

openbao_secret_postgres_prefix: "data/postgres"
openbao_secret_postgres_db_prefix: "{{ openbao_secret_postgres_prefix }}/db"
openbao_secret_postgres_admin: "{{ openbao_secret_postgres_prefix }}/admin"
openbao_secret_rustfs_prefix: "data/rustfs"
openbao_secret_rustfs_admin: "{{ openbao_secret_rustfs_prefix }}/admin"
openbao_secret_forgejo_prefix: "forge/forgejo"
openbao_secret_forgejo_admin: "{{ openbao_secret_forgejo_prefix }}/admin"
openbao_secret_forgejo_tokens: "{{ openbao_secret_forgejo_prefix }}/tokens"
openbao_secret_artifact_keeper_prefix: "proxy/artifact_keeper"
openbao_secret_artifact_keeper_secrets: "{{ openbao_secret_artifact_keeper_prefix }}/secrets"
openbao_secret_artifact_keeper_admin: "{{ openbao_secret_artifact_keeper_prefix }}/admin"
openbao_secret_litellm_prefix: "gpu/litellm"
openbao_secret_litellm_keys: "{{ openbao_secret_litellm_prefix }}/keys"
openbao_secret_bifrost_prefix: "gpu/bifrost"
openbao_secret_bifrost_keys: "{{ openbao_secret_bifrost_prefix }}/keys"

llama_server_hf_repo: unsloth/gemma-4-E4B-it-GGUF
llama_server_hf_file: gemma-4-E4B-it-Q4_K_M.gguf
llama_server_alias: unsloth/gemma-4-E4B-it-GGUF:Q4_K_M
llama_server_ctx_size: 51200
llama_server_max_tokens: 4096

embedding_server_hf_repo: nomic-ai/nomic-embed-text-v1.5-GGUF
embedding_server_hf_file: nomic-embed-text-v1.5.Q4_K_M.gguf
embedding_server_alias: nomic-ai/nomic-embed-text-v1.5-GGUF:Q4_K_M
embedding_server_ctx_size: 2048


# --- test ----

test_output_dir: "{{ local_dir }}/{{ context }}/test"
test_ssh_key: "{{ test_output_dir }}/{{ context }}-test"
