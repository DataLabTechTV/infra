# --- ansible ---

ansible_user: rocky
ansible_python_interpreter: /usr/bin/python3
ansible_ssh_common_args: -o StrictHostKeyChecking=no


# --- configure ---

pki_bootstrap: true

pki_output_dir: "{{ playbook_dir }}/../../output/{{ group_names[0] }}/pki"
pki_root_key_file: "{{ pki_output_dir }}/root-ca.key"
pki_root_csr_file: "{{ pki_output_dir }}/root-ca.csr"
pki_root_cert_file: "{{ pki_output_dir }}/root-ca.crt"


# --- deploy ---

deployment_order:
  - step-ca
  - openbao
  - postgres
  - rustfs
  - forgejo
  - forgejo-runner
  - squid
  - traefik

step_ca_output_dir: "{{ playbook_dir }}/../../output/{{ group_names[0] }}/step-ca"
step_ca_intermediate_key_file: "{{ step_ca_output_dir }}/intermediate-ca.key"
step_ca_intermediate_csr_file: "{{ step_ca_output_dir }}/intermediate-ca.csr"
step_ca_intermediate_cert_file: "{{ step_ca_output_dir }}/intermediate-ca.crt"
step_ca_provisioner_public_key_file: "{{ step_ca_output_dir }}/admin.pub.json"
step_ca_provisioner_private_key_file: "{{ step_ca_output_dir }}/admin.json"

squid_output_dir: "{{ playbook_dir }}/../../output/{{ group_names[0] }}/squid"
squid_key_file: "{{ squid_output_dir }}/squid-ca.key"
squid_csr_file: "{{ squid_output_dir }}/squid-ca.csr"
squid_cert_file: "{{ squid_output_dir }}/squid-ca.crt"

openbao_config_file: "{{ playbook_dir }}/../../quadlets/openbao/config/openbao.json"
openbao_output_dir: "{{ playbook_dir }}/../../output/{{ group_names[0] }}/openbao"
openbao_iac_token_file: "{{ openbao_output_dir }}/iac.token"

openbao_secret_postgres_prefix: "data/postgres"
openbao_secret_postgres_db_prefix: "{{ openbao_secret_postgres_prefix }}/db"
openbao_secret_postgres_admin: "{{ openbao_secret_postgres_prefix }}/admin"
openbao_secret_forgejo_prefix: "forge/forgejo"
openbao_secret_forgejo_admin: "{{ openbao_secret_forgejo_prefix }}/admin"
openbao_secret_forgejo_tokens: "{{ openbao_secret_forgejo_prefix }}/tokens"

openbao_addr: "http://data.lan:8200"

postgres_host: data.lan
postgres_port: 5432

forgejo_addr: "http://forge.lan:3000"
forgejo_admin_user: "forgejo"
forgejo_admin_email: "forgejo@forge.lan"
