all:
  children:
    lab:
      vars:
        vm_ssh_key_path: "{{ lookup('env', 'VM_SSH_KEY_PATH') }}"

      hosts:
        core:
          ansible_host: core.lan
          quadlets:
            - coredns
            - step-ca

        data:
          ansible_host: data.lan
          quadlets:
            - openbao
            - postgres
            - rustfs

        forge:
          ansible_host: forge.lan
          quadlets:
            - forgejo
            - forgejo-runner

        gpu:
          ansible_host: gpu.lan
          nvidia: true
          quadlets:
            - llama-server
            - open-webui

        dev:
          ansible_host: dev.lan
          quadlets:
            - pi-sandbox

        proxy:
          ansible_host: proxy.lan
          quadlets:
            - artifact-keeper
            - traefik
