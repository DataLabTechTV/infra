all:
  children:
    lab:
      hosts:
        ca:
          ansible_host: ca.lan
          quadlets:
            - step-ca

        data:
          ansible_host: data.lan
          quadlets:
            - openbao
            - postgres
            - rustfs

        forge:
          ansible_host: forge.lan
          quadlets:
            - forgejo
            - forgejo-runner

        gpu:
          ansible_host: gpu.lan
          quadlets: []

        dev:
          ansible_host: dev.lan
          quadlets: []

        proxy:
          ansible_host: proxy.lan
          quadlets:
            - squid
            - traefik
            - coredns
