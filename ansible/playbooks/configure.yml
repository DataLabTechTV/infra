---
- name: Configure hosts
  hosts: all
  become: true
  gather_facts: false

  tasks:
    - name: Wait for SSH
      ansible.builtin.wait_for_connection:
        timeout: 300
        delay: 5

    - name: Gather facts
      ansible.builtin.setup:

    - name: Update all packages
      ansible.builtin.dnf:
        name: "*"
        state: latest

    - name: Enable EPEL
      ansible.builtin.dnf:
        name: epel-release
        state: present

    - name: Install container tooling
      ansible.builtin.dnf:
        name:
          - podman
          - cockpit-podman
          - kitty-terminfo
        state: present
