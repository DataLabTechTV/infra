---
- name: Configure hosts
  hosts: all
  become: true
  gather_facts: false

  tasks:
    - name: Wait for SSH
      ansible.builtin.wait_for_connection:
        timeout: 300
        delay: 5

    - name: Gather facts
      ansible.builtin.setup:

    - name: Configure Cockpit
      ansible.builtin.blockinfile:
        path: /etc/cockpit/cockpit.conf
        create: true
        marker: "# {mark} ANSIBLE MANAGED COCKPIT ORIGINS"
        block: |
          [WebService]
          AllowUnencrypted=true
      notify: Restart Cockpit

    - name: Update all packages
      ansible.builtin.dnf:
        name: "*"
        state: latest

    - name: Enable EPEL
      ansible.builtin.dnf:
        name: epel-release
        state: present

    - name: Install container tooling
      ansible.builtin.dnf:
        name:
          - podman
          - cockpit-podman
        state: present

    - name: Configure Podman DNS port
      ansible.builtin.blockinfile:
        path: /etc/containers/containers.conf
        create: true
        marker: "# {mark} ANSIBLE MANAGED PODMAN DNS"
        block: |
          [network]
          dns_bind_port = 5353

    - name: Install Ansible dependencies
      ansible.builtin.dnf:
        name:
          - python3-hvac
          - python3-psycopg2
          - kitty-terminfo
        state: present

    - name: Install quality of life packages
      ansible.builtin.dnf:
        name:
          - kitty-terminfo
        state: present

    - name: Bootstrap PKI
      ansible.builtin.include_role:
        name: pki
      when: pki_bootstrap

  handlers:
    - name: Restart Cockpit
      ansible.builtin.systemd_service:
        name: cockpit.service
        state: restarted
