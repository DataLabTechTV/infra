---
- name: Configure hosts
  hosts: all
  become: true
  gather_facts: false

  tasks:
    - name: Wait for SSH
      ansible.builtin.wait_for_connection:
        timeout: 300
        delay: 5

    - name: Gather facts
      ansible.builtin.setup:

    - name: Configure Cockpit
      ansible.builtin.blockinfile:
        path: /etc/cockpit/cockpit.conf
        create: true
        marker: "# {mark} ANSIBLE MANAGED COCKPIT ORIGINS"
        block: |
          [WebService]
          Origins = https://admin.{{ inventory_hostname }}.{{ context }}.lan wss://admin.{{ inventory_hostname }}.{{ context }}.lan
          ProtocolHeader = X-Forwarded-Proto
          AllowUnencrypted=true
      notify: Restart Cockpit

    - name: Update all packages
      ansible.builtin.dnf:
        name: "*"
        state: latest

    - name: Enable EPEL
      ansible.builtin.dnf:
        name: epel-release
        state: present

    - name: Install container tooling
      ansible.builtin.dnf:
        name:
          - podman
          - cockpit-podman
        state: present

    - name: Install Ansible dependencies
      ansible.builtin.dnf:
        name:
          - python3-hvac
          - python3-psycopg2
        state: present

    - name: Install quality of life packages
      ansible.builtin.dnf:
        name:
          - kitty-terminfo
        state: present

    - name: Configure NVIDIA drivers
      when: nvidia | default(false)
      block:
        - name: Add NVIDIA CUDA repository
          ansible.builtin.yum_repository:
            name: cuda
            description: NVIDIA CUDA Repository
            baseurl: "https://developer.download.nvidia.com/compute/cuda/repos/rhel10/{{ ansible_facts.architecture }}/"
            enabled: true
            gpgcheck: true
            gpgkey: "https://developer.download.nvidia.com/compute/cuda/repos/rhel10/{{ ansible_facts.architecture }}/CDF6BA43.pub"

        - name: Install kernel development packages
          ansible.builtin.dnf:
            name:
              - kernel-devel-matched
              - kernel-headers
            state: present

        - name: Install NVIDIA compute driver
          ansible.builtin.dnf:
            name:
              - nvidia-driver-cuda
              - kmod-nvidia-open-dkms
              - nvtop
            state: present
          notify: Reboot

    - name: Configure NVIDIA GPU container support
      become: true
      when: nvidia | default(false)
      block:
        - name: Add NVIDIA Container Toolkit repository
          ansible.builtin.yum_repository:
            name: nvidia-container-toolkit
            description: NVIDIA Container Toolkit
            baseurl: https://nvidia.github.io/libnvidia-container/stable/rpm/$basearch
            enabled: true
            gpgcheck: false

        - name: Install NVIDIA Container Toolkit
          ansible.builtin.dnf:
            name: nvidia-container-toolkit
            state: present

        - name: Enable NVIDIA CDI refresh
          ansible.builtin.systemd_service:
            name: nvidia-cdi-refresh.path
            enabled: true
            state: started

        - name: Generate NVIDIA CDI specification
          ansible.builtin.command:
            argv:
              - nvidia-ctk
              - cdi
              - generate
              - --output=/etc/cdi/nvidia.yaml
          register: nvidia_cdi_generate
          changed_when: nvidia_cdi_generate.rc == 0

    - name: Bootstrap PKI
      ansible.builtin.include_role:
        name: pki
      when: pki_bootstrap

  handlers:
    - name: Restart Cockpit
      ansible.builtin.systemd_service:
        name: cockpit.service
        state: restarted

    - name: Reboot
      ansible.builtin.reboot:
        msg: Rebooting required
        reboot_timeout: 600
