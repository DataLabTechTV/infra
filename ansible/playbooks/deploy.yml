---
- name: Deploy services
  hosts: all
  order: inventory
  become: true

  tasks:
    - name: Deploy quadlets according to the inventory
      ansible.builtin.include_role:
        name: quadlet
      vars:
        quadlet: "{{ item_quadlet }}"
      loop: "{{ deployment_order | default(quadlets | default([]), true) }}"
      loop_control:
        loop_var: item_quadlet
      when:
        - item_quadlet in quadlets | default([])
        - quadlet is not defined or item_quadlet == quadlet
