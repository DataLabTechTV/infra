---
- name: Deploy services
  hosts: all
  become: true

  tasks:
    - name: Deploy services assigned to host
      ansible.builtin.include_role:
        name: service
      vars:
        service: "{{ item_service }}"
      loop: "{{ deployment_order | default(services | default([]), true) }}"
      loop_control:
        loop_var: item_service
      when:
        - item_service in services | default([])
        - service is not defined or item_service == service
