---
- name: Deploy service
  hosts: all
  become: true

  vars:
    service_dir: "../../services/{{ service }}"
    quadlet_dir: /etc/containers/systemd

  tasks:
    - name: Ensure service configuration directory exists
      ansible.builtin.file:
        path: "/etc/{{ service }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Deploy service configuration
      ansible.builtin.copy:
        src: "{{ service_dir }}/config/"
        dest: "/etc/{{ service }}/"
        owner: root
        group: root
        mode: "0644"
      notify: Restart service

    - name: Deploy Quadlet files
      ansible.builtin.copy:
        src: "{{ item }}"
        dest: "{{ quadlet_dir }}/"
        owner: root
        group: root
        mode: "0644"
      with_fileglob:
        - "{{ service_dir }}/*.container"
        - "{{ service_dir }}/*.volume"
        - "{{ service_dir }}/*.network"
        - "{{ service_dir }}/*.image"
        - "{{ service_dir }}/*.build"
        - "{{ service_dir }}/*.pod"
        - "{{ service_dir }}/*.kube"
        - "{{ service_dir }}/*.artifact"
      notify: Restart service

  handlers:
    - name: Restart service
      ansible.builtin.systemd_service:
        daemon_reload: true
        name: "{{ service }}.service"
        enabled: true
        state: restarted
