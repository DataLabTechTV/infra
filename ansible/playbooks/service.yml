---
- name: Deploy service
  hosts: all
  become: true

  tasks:
    - name: Deploy services
      ansible.builtin.include_role:
        name: service
      vars:
        service: "{{ item_service }}"
      loop: "{{ services | default([]) }}"
      loop_control:
        loop_var: item_service
      when: service is not defined or item_service == service
