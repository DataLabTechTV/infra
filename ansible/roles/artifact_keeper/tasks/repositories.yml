- name: Define Artifact Keeper remote repositories
  ansible.builtin.set_fact:
    artifact_keeper_repositories:
      - key: docker-hub
        name: Docker Hub
        format: docker
        repo_type: remote
        upstream_url: https://registry-1.docker.io
        is_public: true

      - key: quay
        name: Quay
        format: docker
        repo_type: remote
        upstream_url: https://quay.io
        is_public: true

      - key: ghcr
        name: GitHub Container Registry
        format: docker
        repo_type: remote
        upstream_url: https://ghcr.io
        is_public: true

      - key: cargo
        name: Cargo
        format: cargo
        repo_type: remote
        upstream_url: https://crates.io
        is_public: true

      - key: pypi
        name: PyPI
        format: pypi
        repo_type: remote
        upstream_url: https://pypi.org
        is_public: true

      - key: go
        name: Go Modules
        format: go
        repo_type: remote
        upstream_url: https://proxy.golang.org
        is_public: true

      - key: rocky-10-baseos
        name: Rocky Linux 10 BaseOS
        format: rpm
        repo_type: remote
        upstream_url: https://dl.rockylinux.org/pub/rocky/10/BaseOS/x86_64/os/
        is_public: true

      - key: rocky-10-appstream
        name: Rocky Linux 10 AppStream
        format: rpm
        repo_type: remote
        upstream_url: https://dl.rockylinux.org/pub/rocky/10/AppStream/x86_64/os/
        is_public: true

      - key: rocky-10-extras
        name: Rocky Linux 10 Extras
        format: rpm
        repo_type: remote
        upstream_url: https://dl.rockylinux.org/pub/rocky/10/extras/x86_64/os/
        is_public: true

      - key: rocky-10-crb
        name: Rocky Linux 10 CRB
        format: rpm
        repo_type: remote
        upstream_url: https://dl.rockylinux.org/pub/rocky/10/CRB/x86_64/os/
        is_public: true

      - key: fedora-44
        name: Fedora 44
        format: rpm
        repo_type: remote
        upstream_url: https://dl.fedoraproject.org/pub/fedora/linux/releases/44/Everything/x86_64/os/
        is_public: true

      - key: fedora-44-updates
        name: Fedora 44 Updates
        format: rpm
        repo_type: remote
        upstream_url: https://dl.fedoraproject.org/pub/fedora/linux/updates/44/Everything/x86_64/
        is_public: true

      - key: fedora-44-updates-archive
        name: Fedora 44 Updates Archive
        format: rpm
        repo_type: remote
        upstream_url: https://fedoraproject-updates-archive.fedoraproject.org/fedora/44/x86_64/
        is_public: true

      - key: fedora-44-multimedia
        name: Fedora 44 Multimedia (Negativo17)
        format: rpm
        repo_type: remote
        upstream_url: https://negativo17.org/repos/multimedia/fedora-44/x86_64/
        is_public: true

      - key: terra-44
        name: Terra 44
        format: rpm
        repo_type: remote
        upstream_url: https://repos.fyralabs.com/terra44
        is_public: true

      - key: alpine-main
        name: Alpine Main
        format: alpine
        repo_type: remote
        upstream_url: https://dl-cdn.alpinelinux.org/alpine/latest-stable/main
        is_public: true

      - key: alpine-community
        name: Alpine Community
        format: alpine
        repo_type: remote
        upstream_url: https://dl-cdn.alpinelinux.org/alpine/latest-stable/community
        is_public: true

- name: Get existing Artifact Keeper repositories
  ansible.builtin.uri:
    url: "{{ artifact_keeper_addr }}/api/v1/repositories"
    method: GET
    headers:
      Authorization: "Bearer {{ artifact_keeper_token }}"
    return_content: true
    status_code: 200
  register: artifact_keeper_existing
  no_log: true

- name: Extract existing repository keys
  ansible.builtin.set_fact:
    artifact_keeper_existing_keys: >-
      {{
        artifact_keeper_existing.json['items']
        | map(attribute='key')
        | list
      }}

- name: Create missing Artifact Keeper repositories
  ansible.builtin.uri:
    url: "{{ artifact_keeper_addr }}/api/v1/repositories"
    method: POST
    headers:
      Authorization: "Bearer {{ artifact_keeper_token }}"
      Content-Type: application/json
    body: "{{ item }}"
    body_format: json
    status_code: [200, 201]
  loop: "{{ artifact_keeper_repositories }}"
  loop_control:
    label: "{{ item.key }}"
  when: item.key not in artifact_keeper_existing_keys
  no_log: true
