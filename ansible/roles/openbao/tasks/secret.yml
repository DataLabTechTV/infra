- name: Wait for OpenBao API to be reachable
  ansible.builtin.uri:
    url: "{{ openbao_addr }}/v1/sys/health"
    status_code:
      - 200
      - 503
  register: openbao_health
  until: openbao_health.status in [200, 503]
  retries: 10
  delay: 3

- name: Unseal OpenBao
  ansible.builtin.include_tasks: unseal.yml
  when: openbao_health.json.sealed

- name: Authenticate with OpenBao
  ansible.builtin.include_tasks: auth.yml

- name: Get existing secret
  community.hashi_vault.vault_kv2_get:
    url: "{{ openbao_addr }}"
    token: "{{ openbao_iac_token }}"
    engine_mount_point: kv
    path: "{{ secret_path }}"
  register: secret
  failed_when: false
  no_log: true

- name: Generate secret
  ansible.builtin.set_fact:
    _secret: >-
      {{
        _secret | default({}) |
        combine({
          item: lookup(
            'ansible.builtin.password',
            '/dev/null',
            length=32,
            chars=['ascii_letters', 'digits']
          )
        })
      }}
  loop: "{{ secret_passwords | default([]) }}"
  when: secret.data is not defined
  no_log: true

- name: Add static secret fields
  ansible.builtin.set_fact:
    _secret: >-
      {{
        _secret | default({}) |
        combine(secret_values | default({}))
      }}
  when: secret.data is not defined
  no_log: true

- name: Use existing secret
  ansible.builtin.set_fact:
    _secret: "{{ secret.secret }}"
  when: secret.data is defined
  no_log: true

- name: Store secret
  community.hashi_vault.vault_kv2_write:
    url: "{{ openbao_addr }}"
    token: "{{ openbao_iac_token }}"
    engine_mount_point: kv
    path: "{{ secret_path }}"
    data: "{{ _secret }}"
  when: secret.data is not defined
  no_log: true

- name: Set secret fact
  ansible.builtin.set_fact:
    "{{ secret_fact }}": "{{ _secret }}"
  no_log: true
