- name: Get OpenBao host
  ansible.builtin.set_fact:
    openbao_host: >-
      {{
        hostvars
        | dict2items
        | selectattr('value.quadlets', 'defined')
        | selectattr('value.quadlets', 'contains', 'openbao')
        | map(attribute='key')
        | first
      }}

- name: Read OpenBao initialization data
  ansible.builtin.set_fact:
    init: "{{ lookup('ansible.builtin.file', openbao_output_dir + '/init.json') | from_json }}"
  delegate_to: localhost
  become: false
  no_log: true

- name: Check OpenBao seal status
  containers.podman.podman_container_exec:
    name: "{{ container }}"
    env:
      BAO_ADDR: "{{ addr }}"
    command: |
      bao status
  delegate_to: "{{ openbao_host }}"
  register: bao_status
  changed_when: false
  failed_when: bao_status.rc not in [0, 1, 2]

- name: Unseal OpenBao
  containers.podman.podman_container_exec:
    name: "{{ container }}"
    env:
      BAO_ADDR: "{{ addr }}"
    command: |
      bao operator unseal {{ init.unseal_keys_hex[0] }}
  delegate_to: "{{ openbao_host }}"
  when: bao_status.rc == 2
  changed_when: true
  no_log: true
