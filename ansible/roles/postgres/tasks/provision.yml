- name: Setup DB credentials
  ansible.builtin.include_role:
    name: openbao
    tasks_from: secret
  vars:
    secret_path: "{{ openbao_secret_postgres_db_prefix }}/{{ db_name }}"
    secret_fact: db
    secret_values:
        username: "{{ db_user }}"
    secret_passwords:
      - password

- name: Wait for PostgreSQL connection
  ansible.builtin.wait_for:
    host: "{{ postgres_host }}"
    port: "{{ postgres_port }}"
    timeout: 30
    delay: 2

- name: Authenticate with PostgreSQL
  ansible.builtin.include_role:
    name: postgres
    tasks_from: auth

- name: "Create {{ db.username }} PostgreSQL user"
  community.postgresql.postgresql_user:
    name: "{{ db.username }}"
    password: "{{ db.password }}"
    login_host: "{{ postgres_host }}"
    login_port: "{{ postgres_port }}"
    login_password: "{{ postgres_password }}"

- name: "Create {{ db_name }} PostgreSQL database"
  community.postgresql.postgresql_db:
    name: "{{ db_name }}"
    owner: "{{ db.username }}"
    login_host: "{{ postgres_host }}"
    login_port: "{{ postgres_port }}"
    login_password: "{{ postgres_password }}"
    state: present
