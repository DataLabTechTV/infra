- name: Set DB name and user
  ansible.builtin.set_fact:
    quadlet_activation_unit: artifact-keeper.target
    db_name: artifact_keeper
    db_user: artifact_keeper

- name: Provision Artifact Keeper database
  ansible.builtin.include_role:
    name: postgres
    tasks_from: provision

- name: Setup Artifact Keeper secrets
  ansible.builtin.include_role:
    name: openbao
    tasks_from: secret
  vars:
    secret_path: "{{ openbao_secret_artifact_keeper_secrets }}"
    secret_fact: artifact_keeper_secrets
    secret_passwords:
      - jwt_secret

- name: Setup Artifact Keeper credentials
  ansible.builtin.include_role:
    name: openbao
    tasks_from: secret
  vars:
    secret_path: "{{ openbao_secret_artifact_keeper_admin }}"
    secret_fact: artifact_keeper_admin
    secret_values:
        username: admin
    secret_passwords:
      - password

- name: Create Artifact Keeper database URL secret
  containers.podman.podman_secret:
    name: artifact_keeper_database_url
    data: "postgresql://{{ db.username }}:{{ db.password }}@{{ postgres_host }}:{{ postgres_port}}/{{ db_name }}"
    state: present
  no_log: true

- name: Create Artifact Keeper JWT secret
  containers.podman.podman_secret:
    name: artifact_keeper_jwt_secret
    data: "{{ artifact_keeper_secrets.jwt_secret }}"
    state: present
  no_log: true

- name: Create Artifact Keeper admin password secret
  containers.podman.podman_secret:
    name: artifact_keeper_admin_password
    data: "{{ artifact_keeper_admin.password }}"
    state: present
  no_log: true

- name: Deploy Artifact Keeper templates
  ansible.builtin.include_tasks: templates.yml

- name: Authenticate with Artifact Keeper
  ansible.builtin.include_role:
    name: artifact_keeper
    tasks_from: auth

- name: Setup repositories in Artifact Keeper
  ansible.builtin.include_role:
    name: artifact_keeper
    tasks_from: repositories

- name: Disable existing Rocky Linux YUM repositories
  ansible.builtin.command:
    cmd: >-
      dnf config-manager --set-disabled
        baseos appstream extras crb epel
  delegate_to: "{{ item }}"
  loop: "{{ groups['all'] }}"
  become: true
  run_once: true

- name: Configure Artifact Keeper Rocky Linux YUM repositories
  ansible.builtin.copy:
    src: "{{ quadlet_dir }}/config/artifact-keeper.repo"
    dest: /etc/yum.repos.d/artifact-keeper.repo
    owner: root
    group: root
    mode: "0644"
  delegate_to: "{{ item }}"
  loop: "{{ groups['all'] }}"
  become: true
  run_once: true
