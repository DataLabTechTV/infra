- name: Set DB name and user
  ansible.builtin.set_fact:
    db_name: forgejo
    db_user: forgejo

- name: Provision Forgejo database
  ansible.builtin.include_role:
    name: postgres
    tasks_from: provision

- name: Deploy Forgejo templates
  ansible.builtin.include_tasks: templates.yml

- name: Create Forgejo DB password secret
  containers.podman.podman_secret:
    name: forgejo_db_password
    data: "{{ db.password }}"
    state: present
  no_log: true

- name: Setup Forgejo credentials
  ansible.builtin.include_role:
    name: openbao
    tasks_from: secret
  vars:
    secret_path: "{{ openbao_secret_forgejo_admin }}"
    secret_fact: forgejo_admin
    secret_values:
        username: "{{ forgejo_admin_user }}"
    secret_passwords:
      - password

- name: Ensure service is running
  ansible.builtin.include_tasks: restart.yml

- name: Check whether Forgejo admin exists
  containers.podman.podman_container_exec:
    name: "{{ quadlet }}"
    user: 1000
    command: >
      forgejo admin user list
        --config /data/gitea/conf/app.ini
  register: forgejo_users
  changed_when: false
  retries: 30
  delay: 2
  until: forgejo_users.rc == 0

- name: Create Forgejo admin user
  containers.podman.podman_container_exec:
    name: "{{ quadlet }}"
    user: 1000
    command: >
      forgejo admin user create
        --username {{ forgejo_admin.username }}
        --email {{ forgejo_admin_email }}
        --admin
        --password {{ forgejo_admin.password }}
        --config /data/gitea/conf/app.ini
  when: forgejo_admin.username not in forgejo_users.stdout

- name: Get existing API token secret
  community.hashi_vault.vault_kv2_get:
    url: "{{ openbao_addr }}"
    token: "{{ openbao_iac_token }}"
    engine_mount_point: kv
    path: "{{ openbao_secret_forgejo_tokens }}"
  register: tokens_secret
  failed_when: false
  no_log: true

- name: Generate Forgejo API token
  containers.podman.podman_container_exec:
    name: forgejo
    user: 1000
    command: >
      forgejo admin user generate-access-token
        --username {{ forgejo_admin_user }}
        --token-name ansible
        --raw
  register: forgejo_api_token
  when: tokens_secret.data is not defined
  no_log: false

- name: Store Forgejo API token secret
  community.hashi_vault.vault_kv2_write:
    url: "{{ openbao_addr }}"
    token: "{{ openbao_iac_token }}"
    engine_mount_point: kv
    path: "{{ openbao_secret_forgejo_tokens }}"
    data:
      admin: "{{ forgejo_api_token.stdout | trim }}"
  when: forgejo_api_token is changed
  no_log: true
