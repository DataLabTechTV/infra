- name: "Copy root CA certificate to {{ quadlet }} quadlet build context"
  ansible.builtin.copy:
    src: "{{ pki_root_cert_file }}"
    dest: "{{ quadlet_ctx_dir }}/{{ quadlet }}/"
    owner: root
    group: root
    mode: "0644"
  when: pki_bootstrap
  notify: "Restart {{ quadlet }} service"

- name: Enable Podman socket
  ansible.builtin.systemd_service:
    name: podman.socket
    enabled: true
    state: started

- name: Authenticate with Forgejo
  ansible.builtin.include_role:
    name: forgejo
    tasks_from: auth

- name: Get Forgejo runners
  ansible.builtin.uri:
    url: "{{ forgejo_addr }}/api/v1/admin/actions/runners"
    headers:
      Authorization: "token {{ forgejo_api_token }}"
    return_content: true
  register: forgejo_runners
  no_log: true

- name: Check if Forgejo runner exists
  ansible.builtin.set_fact:
    forgejo_runner_exists: >-
      {{
        forgejo_runners.json
        | selectattr('name', 'equalto', 'ubuntu-latest')
        | list
        | length > 0
      }}

- name: Generate random hexadecimal string
  ansible.builtin.set_fact:
    forgejo_token: >-
      {{
        lookup(
          'ansible.builtin.password',
          '/dev/null',
          length=40,
          chars='hexdigits'
        )
      }}
  when: not forgejo_runner_exists

- name: Create Forgejo token secret
  containers.podman.podman_secret:
    name: forgejo_token
    data: "{{ forgejo_token }}"
    state: present
  no_log: true
  when: not forgejo_runner_exists

- name: Register Forgejo runner
  containers.podman.podman_container_exec:
    name: forgejo
    user: 1000
    command: >
      forgejo forgejo-cli actions register
        --name ubuntu-latest
        --secret {{ forgejo_token }}
  register: forgejo_register
  when: not forgejo_runner_exists
  no_log: false

- name: Find existing Forgejo runner
  ansible.builtin.set_fact:
    forgejo_runner: >-
      {{
        forgejo_runners.json
        | selectattr('name', 'equalto', 'ubuntu-latest')
        | first
        | default(none)
      }}

- name: Set Forgejo runner UUID
  ansible.builtin.set_fact:
    forgejo_uuid: >-
      {{
        forgejo_runner.uuid if forgejo_runner
        else forgejo_register.stdout | trim
      }}

- name: Deploy Forgejo runner templates
  ansible.builtin.include_tasks: templates.yml
