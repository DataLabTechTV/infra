- name: "Ensure {{ quadlet }} configuration directory exists"
  ansible.builtin.file:
    path: "/etc/{{ quadlet }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: "Check for {{ quadlet }} configuration"
  ansible.builtin.stat:
    path: "{{ quadlet_dir }}/config"
  delegate_to: localhost
  become: false
  register: quadlet_config

- name: "Deploy {{ quadlet }} configuration"
  ansible.builtin.copy:
    src: "{{ quadlet_dir }}/config/"
    dest: "/etc/{{ quadlet }}/"
    owner: root
    group: root
    mode: "0644"
  when: quadlet_config.stat.exists and quadlet_config.stat.isdir
  notify: "Restart {{ quadlet }} service"

- name: "Deploy {{ quadlet }} quadlet files"
  ansible.builtin.copy:
    src: "{{ item_quadlet_unit }}"
    dest: "{{ install_dir }}/"
    owner: root
    group: root
    mode: "0644"
  with_fileglob:
    - "{{ quadlet_dir }}/*.container"
    - "{{ quadlet_dir }}/*.volume"
    - "{{ quadlet_dir }}/*.network"
    - "{{ quadlet_dir }}/*.image"
    - "{{ quadlet_dir }}/*.build"
    - "{{ quadlet_dir }}/*.pod"
    - "{{ quadlet_dir }}/*.kube"
    - "{{ quadlet_dir }}/*.artifact"
  loop_control:
    loop_var: item_quadlet_unit
  notify: "Restart {{ quadlet }} service"

- name: Quadlet-specific configuration
  ansible.builtin.include_tasks: "{{ quadlet | replace('-', '_') }}.yml"
  when: >
    lookup(
      'ansible.builtin.first_found',
      {
        'files': [quadlet | replace('-', '_') + '.yml'],
        'paths': [role_path + '/tasks']
      },
      errors='ignore'
    ) is not none
