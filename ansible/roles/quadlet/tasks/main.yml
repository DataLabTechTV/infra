- name: "Ensure {{ quadlet }} configuration directory exists"
  ansible.builtin.file:
    path: "{{ quadlet_scoped_config_dir }}"
    state: directory
    owner: "{{ quadlet_scoped_user }}"
    group: "{{ quadlet_scoped_group }}"
    mode: "0755"

- name: "Check for {{ quadlet }} configuration"
  ansible.builtin.stat:
    path: "{{ quadlet_dir }}/config"
  delegate_to: localhost
  become: false
  register: quadlet_config

- name: "Deploy {{ quadlet }} configuration"
  ansible.builtin.copy:
    src: "{{ quadlet_dir }}/config/"
    dest: "{{ quadlet_scoped_config_dir }}"
    owner: "{{ quadlet_scoped_user }}"
    group: "{{ quadlet_scoped_group }}"
    mode: "0644"
  when: quadlet_config.stat.exists and quadlet_config.stat.isdir
  notify: "Restart {{ quadlet }} service"

- name: "Deploy {{ quadlet }} quadlet files"
  ansible.builtin.copy:
    src: "{{ item_quadlet_unit }}"
    dest: "{{ quadlet_scoped_dir }}/"
    owner: "{{ quadlet_scoped_user }}"
    group: "{{ quadlet_scoped_group }}"
    mode: "0644"
  with_fileglob:
    - "{{ quadlet_dir }}/*.container"
    - "{{ quadlet_dir }}/*.volume"
    - "{{ quadlet_dir }}/*.network"
    - "{{ quadlet_dir }}/*.image"
    - "{{ quadlet_dir }}/*.build"
    - "{{ quadlet_dir }}/*.pod"
    - "{{ quadlet_dir }}/*.kube"
    - "{{ quadlet_dir }}/*.artifact"
  loop_control:
    loop_var: item_quadlet_unit
  notify: "Restart {{ quadlet }} service"

- name: "Deploy templated {{ quadlet }} quadlet files"
  ansible.builtin.template:
    src: "{{ item_quadlet_template }}"
    dest: "{{ quadlet_scoped_dir }}/{{ item_quadlet_template | basename | regex_replace('\\.j2$', '') }}"
    owner: "{{ quadlet_scoped_user }}"
    group: "{{ quadlet_scoped_group }}"
    mode: "0644"
  with_fileglob:
    - "{{ quadlet_dir }}/*.container.j2"
    - "{{ quadlet_dir }}/*.volume.j2"
    - "{{ quadlet_dir }}/*.network.j2"
    - "{{ quadlet_dir }}/*.image.j2"
    - "{{ quadlet_dir }}/*.build.j2"
    - "{{ quadlet_dir }}/*.pod.j2"
    - "{{ quadlet_dir }}/*.kube.j2"
    - "{{ quadlet_dir }}/*.artifact.j2"
  loop_control:
    loop_var: item_quadlet_template
  notify: "Restart {{ quadlet }} service"

- name: "Find auxiliary systemd units for {{ quadlet }} quadlet"
  ansible.builtin.find:
    paths: "{{ quadlet_dir }}"
    patterns:
      - "*.service"
      - "*.timer"
      - "*.path"
      - "*.target"
    file_type: file
  register: systemd_units
  delegate_to: localhost
  become: false

- name: "Deploy auxiliary systemd units for {{ quadlet }} quadlet"
  ansible.builtin.copy:
    src: "{{ item.path }}"
    dest: "{{ systemd_scoped_dir }}/"
    mode: "0644"
  loop: "{{ systemd_units.files }}"

- name: "Enable and start auxiliary systemd units for {{ quadlet }} quadlet"
  ansible.builtin.systemd_service:
    scope: "{{ quadlet_scope }}"
    daemon_reload: true
    name: "{{ item.path | basename }}"
    enabled: true
    state: "{{ 'started' if not item.path.endswith('.service') and not item.path.endswith('.target') else omit }}"
  loop: "{{ systemd_units.files }}"

- name: Check for {{ quadlet }} quadlet build context
  ansible.builtin.stat:
    path: "{{ quadlet_dir }}/{{ quadlet }}"
  delegate_to: localhost
  register: quadlet_ctx
  become: false

- name: "Deploy {{ quadlet }} quadlet build context"
  ansible.builtin.copy:
    src: "{{ quadlet_dir }}/{{ quadlet }}"
    dest: "{{ quadlet_scoped_ctx_dir | dirname }}"
    owner: "{{ quadlet_scoped_user }}"
    group: "{{ quadlet_scoped_group }}"
    mode: "0755"
  when: quadlet_ctx.stat.exists and quadlet_ctx.stat.isdir
  notify: "Restart {{ quadlet }} service"

- name: Quadlet-specific configuration
  ansible.builtin.include_tasks: "{{ quadlet | replace('-', '_') }}.yml"
  when: >
    lookup(
      'ansible.builtin.first_found',
      {
        'files': [quadlet | replace('-', '_') + '.yml'],
        'paths': [role_path + '/tasks']
      },
      errors='ignore'
    ) is not none
