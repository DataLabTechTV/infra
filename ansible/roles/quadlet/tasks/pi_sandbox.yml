- name: Set llama-server host
  ansible.builtin.set_fact:
    llama_server_host: >-
      {{
        groups['lab']
        | map('extract', hostvars)
        | selectattr('quadlets', 'contains', 'llama-server')
        | map(attribute='inventory_hostname')
        | first
      }}

- name: Set bifrost host
  ansible.builtin.set_fact:
    bifrost_host: >-
      {{
        groups['lab']
        | map('extract', hostvars)
        | selectattr('quadlets', 'contains', 'bifrost')
        | map(attribute='inventory_hostname')
        | first
      }}

- name: Gather facts from the llama-server host
  ansible.builtin.setup:
  delegate_to: "{{ llama_server_host }}"
  delegate_facts: true

- name: Gather facts from the bifrost host
  ansible.builtin.setup:
  delegate_to: "{{ bifrost_host }}"
  delegate_facts: true

- name: Deploy Pi sandbox templates
  ansible.builtin.include_tasks: templates.yml

- name: Enable and start nftables
  ansible.builtin.systemd_service:
    name: nftables
    enabled: true
    state: started
  notify: "Restart {{ quadlet }}"

- name: Include Pi Sandbox nftables rules
  ansible.builtin.blockinfile:
    path: /etc/sysconfig/nftables.conf
    block: 'include "/etc/pi-sandbox/pi_sandbox.nft"'
    marker: '# {mark} ANSIBLE MANAGED PI SANDBOX'
    state: present

- name: Reload nftables
  ansible.builtin.systemd_service:
    name: nftables
    state: reloaded
  notify: "Restart {{ quadlet }}"
