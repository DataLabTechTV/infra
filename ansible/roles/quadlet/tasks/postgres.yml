- name: Setup PostgreSQL credentials
  ansible.builtin.include_role:
    name: openbao
    tasks_from: secret
  vars:
    secret_path: "{{ openbao_secret_postgres_admin }}"
    secret_fact: postgres
    secret_passwords:
      - password

- name: Create PostgreSQL password secret
  containers.podman.podman_secret:
    name: postgres_password
    data: "{{ postgres.password }}"
    state: present
  no_log: true

- name: Ensure quadlet service is running
  ansible.builtin.include_tasks: restart.yml
