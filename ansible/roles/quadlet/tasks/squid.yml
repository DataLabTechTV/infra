- name: Check PKI bootstrap
  ansible.builtin.assert:
    that:
      - pki_bootstrap
    fail_msg: >-
      Squid Proxy deployment requires pki_bootstrap=true.
      Run configure with PKI bootstrap enabled first.

- name: Create squid certificates directory
  ansible.builtin.file:
    path: "/etc/squid/ssl"
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Create step-ca provisioner JWK directory
  ansible.builtin.file:
    path: "/etc/squid/step"
    state: directory
    mode: "0700"

- name: Copy step-ca root CA certificate
  ansible.builtin.copy:
    src: "{{ pki_root_cert_file }}"
    dest: "/etc/squid/step/root-ca.crt"
    mode: "0600"

- name: Copy step-ca provisioner public JWK
  ansible.builtin.copy:
    src: "{{ step_ca_squid_private_key_file }}"
    dest: "/etc/squid/step/squid.json"
    mode: "0600"

- name: Deploy squid templates
  ansible.builtin.include_tasks: templates.yml
