- name: Check PKI bootstrap
  ansible.builtin.assert:
    that:
      - pki_bootstrap
    fail_msg: >-
      Step CA deployment requires pki_bootstrap=true.
      Run configure with PKI bootstrap enabled first.

- name: Create step-ca output directory
  ansible.builtin.file:
    path: "{{ step_ca_output_dir }}"
    state: directory
    mode: "0700"
  delegate_to: localhost
  become: false

- name: Generate intermediate CA private key
  community.crypto.openssl_privatekey:
    path: "{{ step_ca_intermediate_key_file }}"
    type: ECC
    curve: secp256r1
    mode: "0600"
  delegate_to: localhost
  become: false

- name: Generate intermediate CA CSR
  community.crypto.openssl_csr:
    path: "{{ step_ca_intermediate_csr_file }}"
    privatekey_path: "{{ step_ca_intermediate_key_file }}"
    common_name: "{{ context }} Intermediate CA"
    basic_constraints:
      - "CA:TRUE"
      - "pathlen:1"
    basic_constraints_critical: true
    key_usage:
      - keyCertSign
      - cRLSign
    key_usage_critical: true
  delegate_to: localhost
  become: false

- name: Sign intermediate CA certificate
  community.crypto.x509_certificate:
    path: "{{ step_ca_intermediate_cert_file }}"
    csr_path: "{{ step_ca_intermediate_csr_file }}"
    ownca_path: "{{ pki_root_cert_file }}"
    ownca_privatekey_path: "{{ pki_root_key_file }}"
    provider: ownca
    ownca_not_after: "+1825d"
  delegate_to: localhost
  become: false

- name: Create step-ca certificates directory
  ansible.builtin.file:
    path: "/etc/step-ca/certs"
    state: directory
    owner: 1000
    group: 1000
    mode: "0755"

- name: Copy root CA certificate
  ansible.builtin.copy:
    src: "{{ pki_root_cert_file }}"
    dest: "/etc/step-ca/certs/root-ca.crt"
    owner: 1000
    group: 1000
    mode: "0644"
  notify: "Restart {{ quadlet }} service"

- name: Copy intermediate CA certificate
  ansible.builtin.copy:
    src: "{{ step_ca_intermediate_cert_file }}"
    dest: "/etc/step-ca/certs/intermediate-ca.crt"
    owner: 1000
    group: 1000
    mode: "0644"
  notify: "Restart {{ quadlet }} service"

- name: Create step-ca secrets directory
  ansible.builtin.file:
    path: "/etc/step-ca/secrets"
    state: directory
    owner: 1000
    group: 1000
    mode: "0700"

- name: Copy intermediate CA private key
  ansible.builtin.copy:
    src: "{{ step_ca_intermediate_key_file }}"
    dest: "/etc/step-ca/secrets/intermediate-ca.key"
    owner: 1000
    group: 1000
    mode: "0600"
  notify: "Restart {{ quadlet }} service"

- name: Generate admin JWK provisioner key
  containers.podman.podman_container:
    name: step-ca-jwk
    image: docker.io/smallstep/step-cli:0.30.2
    userns: keep-id
    command: >
      step crypto jwk create
        /output/{{ step_ca_admin_public_key_file | basename }}
        /output/{{ step_ca_admin_private_key_file | basename }}
        --no-password
        --insecure
        --force
    volumes:
      - "{{ step_ca_output_dir | realpath }}:/output:z"
    state: started
    rm: true
  delegate_to: localhost
  become: false
  when:
    - not step_ca_admin_public_key_file is exists
      or not step_ca_admin_private_key_file is exists

- name: Generate squid JWK provisioner key
  containers.podman.podman_container:
    name: step-ca-jwk
    image: docker.io/smallstep/step-cli:0.30.2
    userns: keep-id
    command: >
      step crypto jwk create
        /output/{{ step_ca_squid_public_key_file | basename }}
        /output/{{ step_ca_squid_private_key_file | basename }}
        --no-password
        --insecure
        --force
    volumes:
      - "{{ step_ca_output_dir | realpath }}:/output:z"
    state: started
    rm: true
  delegate_to: localhost
  become: false
  when:
    - not step_ca_squid_public_key_file is exists
      or not step_ca_squid_private_key_file is exists

- name: Read admin provisioner public JWK
  ansible.builtin.slurp:
    src: "{{ step_ca_admin_public_key_file }}"
  register: step_ca_admin_public_jwk
  delegate_to: localhost
  become: false

- name: Read squid provisioner public JWK
  ansible.builtin.slurp:
    src: "{{ step_ca_squid_public_key_file }}"
  register: step_ca_squid_public_jwk
  delegate_to: localhost
  become: false

- name: Copy admin provisioner private JWT
  ansible.builtin.copy:
    src: "{{ step_ca_admin_private_key_file }}"
    dest: "/etc/step-ca/secrets/admin.json"
    owner: 1000
    group: 1000
    mode: "0600"

- name: Copy squid provisioner private JWT
  ansible.builtin.copy:
    src: "{{ step_ca_squid_private_key_file }}"
    dest: "/etc/step-ca/secrets/squid.json"
    owner: 1000
    group: 1000
    mode: "0600"

- name: Deploy step-ca templates
  ansible.builtin.include_tasks: templates.yml
