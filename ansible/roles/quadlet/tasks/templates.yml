- name: "Find config templates for {{ quadlet }} quadlet"
  ansible.builtin.find:
    paths: "{{ quadlet_dir }}/templates"
    recurse: true
    patterns: "*.j2"
    file_type: file
  become: false
  delegate_to: localhost
  register: quadlet_templates

- name: "Create template directories for {{ quadlet }} quadlet"
  ansible.builtin.file:
    path: "{{ quadlet_scoped_config_dir }}/{{ item.path | relpath(quadlet_dir ~ '/templates') | dirname }}"
    state: directory
    owner: "{{ quadlet_scoped_user }}"
    group: "{{ quadlet_scoped_group }}"
    mode: "0755"
  loop: "{{ quadlet_templates.files }}"
  loop_control:
    label: "{{ item.path }}"
  when: >-
    (item.path | relpath(quadlet_dir ~ '/templates') | dirname) != '.'

- name: "Deploy config templates for {{ quadlet }} quadlet"
  ansible.builtin.template:
    src: "{{ item.path }}"
    dest: "{{ quadlet_scoped_config_dir }}/{{ item.path | relpath(quadlet_dir ~ '/templates') | regex_replace('\\.j2$', '') }}"
    owner: "{{ quadlet_scoped_user }}"
    group: "{{ quadlet_scoped_group }}"
    mode: "0644"
  loop: "{{ quadlet_templates.files }}"
  loop_control:
    label: "{{ item.path }}"
  notify: "Restart {{ quadlet }}"
