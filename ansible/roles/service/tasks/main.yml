- name: Ensure service configuration directory exists
  ansible.builtin.file:
    path: "/etc/{{ service }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Deploy service configuration
  ansible.builtin.copy:
    src: "{{ service_dir }}/config/"
    dest: "/etc/{{ service }}/"
    owner: root
    group: root
    mode: "0644"
  notify: Restart service

- name: Deploy Quadlet files
  ansible.builtin.copy:
    src: "{{ item_quadlet_unit }}"
    dest: "{{ quadlet_dir }}/"
    owner: root
    group: root
    mode: "0644"
  with_fileglob:
    - "{{ service_dir }}/*.container"
    - "{{ service_dir }}/*.volume"
    - "{{ service_dir }}/*.network"
    - "{{ service_dir }}/*.image"
    - "{{ service_dir }}/*.build"
    - "{{ service_dir }}/*.pod"
    - "{{ service_dir }}/*.kube"
    - "{{ service_dir }}/*.artifact"
  loop_control:
    loop_var: item_quadlet_unit
  notify: Restart service

- name: Check whether service exists
  ansible.builtin.stat:
    path: "/etc/containers/systemd/{{ service }}.container"
  register: service_file

- name: Ensure service is running
  ansible.builtin.systemd_service:
    daemon_reload: true
    name: "{{ service }}.service"
    enabled: true
    state: started
  when: service_file.stat.exists

- name: Run pending service handlers
  ansible.builtin.meta: flush_handlers

- name: Service-specific configuration
  ansible.builtin.include_tasks: "{{ service }}.yml"
  when: >
    lookup(
      'ansible.builtin.first_found',
      {
        'files': [service + '.yml'],
        'paths': [role_path + '/tasks']
      },
      errors='ignore'
    ) is not none
