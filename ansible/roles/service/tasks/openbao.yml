- name: Read OpenBao configuration
  ansible.builtin.set_fact:
    config: "{{ lookup('ansible.builtin.file', openbao_config_file) | from_json }}"

- name: Set CLI API address
  ansible.builtin.set_fact:
    local_addr: >-
      {{ config.api_addr | urlsplit('scheme') }}://127.0.0.1:{{
        config.api_addr | urlsplit('port')
      }}

- name: Check OpenBao initialization status
  ansible.builtin.command:
    cmd: |
      podman exec
        --env BAO_ADDR={{ local_addr }}
        {{ service }}
        bao operator init -status
  register: bao_init_status
  changed_when: false
  failed_when: bao_init_status.rc not in [0, 2]

- name: Initialize OpenBao
  ansible.builtin.command:
    cmd: |
      podman exec
        --env BAO_ADDR={{ local_addr }}
        {{ service }}
        bao operator init
          -format=json
          -key-shares=1
          -key-threshold=1
  register: bao_init
  when: bao_init_status.rc == 2
  changed_when: true
  no_log: true

- name: Create OpenBao output directory
  ansible.builtin.file:
    path: "{{ openbao_output_dir }}"
    state: directory
    mode: "0700"
  delegate_to: localhost
  become: false

- name: Save OpenBao initialization data
  ansible.builtin.copy:
    content: "{{ bao_init.stdout }}"
    dest: "{{ openbao_output_dir }}/init.json"
    mode: "0600"
  delegate_to: localhost
  become: false
  when: bao_init.changed
  no_log: true

- name: Unseal OpenBao
  ansible.builtin.include_role:
    name: openbao
    tasks_from: unseal
  vars:
    addr: "{{ local_addr }}"

- name: Check enabled secrets engines
  ansible.builtin.command:
    cmd: |
      podman exec
        --env BAO_ADDR={{ local_addr }}
        --env BAO_TOKEN={{ init.root_token }}
        {{ service }}
        bao secrets list -format=json
  register: bao_engines
  changed_when: false
  no_log: true

- name: Enable OpenBao KV2 secrets engine
  ansible.builtin.command:
    cmd: |
      podman exec
        --env BAO_ADDR={{ local_addr }}
        --env BAO_TOKEN={{ init.root_token }}
        {{ service }}
        bao secrets enable -version=2 kv
  when: "'kv/' not in (bao_engines.stdout | from_json)"

- name: Configure IaC policy
  ansible.builtin.command:
    cmd: |
      podman exec --interactive
        --env BAO_ADDR={{ local_addr }}
        --env BAO_TOKEN={{ init.root_token }}
        {{ service }}
        bao policy write iac /etc/{{ service }}/policies/iac.hcl

- name: Create IaC token
  ansible.builtin.command:
    cmd: |
      podman exec --interactive
        --env BAO_ADDR={{ local_addr }}
        --env BAO_TOKEN={{ init.root_token }}
        {{ service }}
        bao token create -policy=iac -ttl=0 -orphan -format=json
  register: iac_token
  no_log: true

- name: Save IaC token locally
  ansible.builtin.copy:
    content: "{{ (iac_token.stdout | from_json).auth.client_token }}\n"
    dest: "{{ openbao_output_dir }}/iac.token"
    mode: "0600"
  delegate_to: localhost
  become: false
  no_log: true
