- name: Find service templates
  ansible.builtin.find:
    paths: "{{ service_dir }}/templates"
    recurse: true
    patterns: "*.j2"
    file_type: file
  become: false
  delegate_to: localhost
  register: service_templates

- name: Deploy service templates
  ansible.builtin.template:
    src: "{{ item.path }}"
    dest: "/etc/{{ service }}/{{ item.path | relpath(service_dir ~ '/templates') | regex_replace('\\.j2$', '') }}"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ service_templates.files }}"
  notify: Restart service
