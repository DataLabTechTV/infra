model_list:
  - model_name: lab-gemma
    litellm_params:
      model: openai/unsloth/gemma-4-E4B-it-GGUF:Q4_K_M
      api_base: http://llama-server:8080/v1
      api_key: sk-no-key-required
      input_cost_per_token: 0.00000018056
      output_cost_per_token: 0.00000018056

  - model_name: auto
    litellm_params:
      model: auto_router/complexity_router

      complexity_router_config:
        tiers:
          SIMPLE: lab-gemma
          MEDIUM: lab-gemma
          COMPLEX: lab-gemma
          REASONING: lab-gemma

        classifier_type: heuristic_v2
        classifier_fallback: heuristic

      complexity_router_default_model: lab-gemma

litellm_settings:
  drop_params: true

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
