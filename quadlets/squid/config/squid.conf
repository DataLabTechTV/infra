# /etc/squid/squid.conf

# -------------------------------------------------------------------
# Proxy
# -------------------------------------------------------------------

http_port 3128 ssl-bump \
    cert=/etc/squid/ssl/squid-ca.crt \
    key=/etc/squid/ssl/squid-ca.key \
    generate-host-certificates=on \
    dynamic_cert_mem_cache_size=4MB

# -------------------------------------------------------------------
# TLS certificate generation
# -------------------------------------------------------------------

sslcrtd_program /usr/lib/squid/security_file_certgen \
    -s /var/cache/squid/ssl_db \
    -M 4MB

sslcrtd_children 5

# -------------------------------------------------------------------
# SSL bump
# -------------------------------------------------------------------

acl step1 at_step SslBump1

ssl_bump peek step1
ssl_bump bump all

# -------------------------------------------------------------------
# Network access
# -------------------------------------------------------------------

acl localnet src 192.168.0.0/16
acl localnet src 10.0.0.0/8
acl localnet src 172.16.0.0/12

acl SSL_ports port 443
acl Safe_ports port 80
acl Safe_ports port 443
acl Safe_ports port 1025-65535

acl CONNECT method CONNECT
acl intermediate_fetching transaction_initiator certificate-fetching

http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports

http_access allow intermediate_fetching
http_access allow localnet
http_access deny all

# -------------------------------------------------------------------
# Cache
# -------------------------------------------------------------------

cache_dir aufs /var/cache/squid 153600 16 256

# Cache HTTP and decrypted HTTPS responses
cache allow all

maximum_object_size 30 GB

# Cache these for 7 days
refresh_pattern -i \.(zip|tar|gz|tgz|xz|txz|bz2|tbz2|zst|7z|rar|lz4|lz|br|Z)$ 10080 100% 43200
refresh_pattern -i \.(apk|rpm|deb)$ 10080 100% 43200
refresh_pattern -i \.(whl|crate|rlib|so|dylib)$ 10080 100% 43200
refresh_pattern -i ^https?://static\.crates\.io/crates/[^/]+/[^/]+/download$ 10080 100% 43200
refresh_pattern -i ^https?://ghcr\.io/v2/.*/blobs/sha256:.*$ 10080 100% 43200
refresh_pattern -i ^https?://pkg-containers\.githubusercontent\.com/ghcrblobs[0-9]*/blobs/sha256:.*$ 10080 100% 43200

# -------------------------------------------------------------------
# Logging
# -------------------------------------------------------------------

access_log /dev/stdout
cache_log /dev/stdout
