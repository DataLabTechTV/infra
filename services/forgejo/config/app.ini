[server]
DOMAIN = ${FORGEJO__SERVER__DOMAIN}
ROOT_URL = ${FORGEJO__SERVER__ROOT_URL}
HTTP_PORT = 3000

[database]
DB_TYPE = postgres
HOST = ${FORGEJO__DATABASE__HOST}
NAME = ${FORGEJO__DATABASE__NAME}
USER = ${FORGEJO__DATABASE__USER}
PASSWD = ${FORGEJO__DATABASE__PASSWD}

[service]
DISABLE_REGISTRATION = true
REQUIRE_SIGNIN_VIEW = false
