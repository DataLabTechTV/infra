on:
  workflow_dispatch:

jobs:
  test:
    runs-on: rockylinux-10

    steps:
      - uses: actions/checkout@v6

      - run: |
          echo "Forgejo CI test"

      - name: Show DNS
        run: cat /etc/resolv.conf

      - name: Resolve git.lab.lan
        run: getent hosts git.lab.lan

      - name: Downloading Alpine Linux ISO (used to test the cache proxy)
        run: |
          wget "https://dl-cdn.alpinelinux.org/alpine/v3.24/releases/x86_64/alpine-standard-3.24.2-x86_64.iso"
