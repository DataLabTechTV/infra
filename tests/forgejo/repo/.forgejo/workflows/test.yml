on:
  workflow_dispatch:

jobs:
  test:
    runs-on: rockylinux-10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Show environment variables
        run: env

      - name: Show DNS
        run: cat /etc/resolv.conf

      - name: Resolve git.lab.lan
        run: getent hosts git.lab.lan

      - name: Hash mounted certificates
        run: md5sum /etc/local-ca/*

      - name: Testing cache proxy
        run: bash test-proxy.sh

      - name: Build container image
        run: podman build -f Containerfile .
